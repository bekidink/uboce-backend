name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build, end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Generate Prisma clients and build shared packages
        run: pnpm generate && pnpm --filter "./packages/*" build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm -r build

      # Same infrastructure as local development: Postgres, Redis, Mailpit, SeaweedFS (S3).
      - name: Start infrastructure
        run: docker compose up -d --wait postgres redis mailpit seaweedfs
      - name: Create service databases
        run: pnpm infra:db
      - name: Prepare .env files and keys
        run: pnpm setup
      - name: Apply migrations (reviewed, committed migrations only)
        run: pnpm migrate

      - name: Start services and gateway
        run: |
          mkdir -p logs
          for dir in services/* apps/gateway; do
            (cd "$dir" && nohup node dist/main.js > "../../logs/$(basename "$dir").log" 2>&1 &)
          done
          for i in $(seq 1 90); do curl -sf localhost:4100/health/ready && exit 0; sleep 1; done
          echo "services did not become ready"; curl -s localhost:4100/health/ready; tail -n 30 logs/*.log; exit 1
      - name: End-to-end smoke test (through the gateway)
        run: pnpm smoke

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: logs/

  images:
    name: Docker image (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: verify
    # Pushes to main publish images for the VPS deployment (deploy/vps); pull requests only build.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gateway, context: ., target: runtime, build-args: "TARGET=apps/gateway" }
          - { name: administration, context: ., target: runtime, build-args: "TARGET=services/administration" }
          - { name: agriculture, context: ., target: runtime, build-args: "TARGET=services/agriculture" }
          - { name: analytics, context: ., target: runtime, build-args: "TARGET=services/analytics" }
          - { name: catalog, context: ., target: runtime, build-args: "TARGET=services/catalog" }
          - { name: commerce, context: ., target: runtime, build-args: "TARGET=services/commerce" }
          - { name: discovery, context: ., target: runtime, build-args: "TARGET=services/discovery" }
          - { name: dispute, context: ., target: runtime, build-args: "TARGET=services/dispute" }
          - { name: document, context: ., target: runtime, build-args: "TARGET=services/document" }
          - { name: finance, context: ., target: runtime, build-args: "TARGET=services/finance" }
          - { name: identity, context: ., target: runtime, build-args: "TARGET=services/identity" }
          - { name: integration, context: ., target: runtime, build-args: "TARGET=services/integration" }
          - { name: inventory, context: ., target: runtime, build-args: "TARGET=services/inventory" }
          - { name: kyb, context: ., target: runtime, build-args: "TARGET=services/kyb" }
          - { name: kyc, context: ., target: runtime, build-args: "TARGET=services/kyc" }
          - { name: logistics, context: ., target: runtime, build-args: "TARGET=services/logistics" }
          - { name: manufacturing, context: ., target: runtime, build-args: "TARGET=services/manufacturing" }
          - { name: notification, context: ., target: runtime, build-args: "TARGET=services/notification" }
          - { name: organization, context: ., target: runtime, build-args: "TARGET=services/organization" }
          - { name: procurement, context: ., target: runtime, build-args: "TARGET=services/procurement" }
          - { name: quality, context: ., target: runtime, build-args: "TARGET=services/quality" }
          - { name: warehouse, context: ., target: runtime, build-args: "TARGET=services/warehouse" }
          - { name: migrate, context: ., target: migrate, build-args: "" }
          - { name: storage, context: infrastructure/docker/seaweedfs, target: "", build-args: "" }
    steps:
      - uses: actions/checkout@v4
      # ARM images too: Oracle Cloud's Always Free servers are ARM (Ampere).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build-args }}
          push: ${{ github.event_name == 'push' }}
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/uboce-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/uboce-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
