name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build, end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Generate Prisma clients and build shared packages
        run: pnpm generate && pnpm --filter "./packages/*" build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm -r build

      # Same infrastructure as local development: Postgres, Redis, Mailpit, SeaweedFS (S3).
      - name: Start infrastructure
        run: docker compose up -d --wait postgres redis mailpit seaweedfs
      - name: Create service databases
        run: pnpm infra:db
      - name: Prepare .env files and keys
        run: pnpm setup
      - name: Apply migrations (reviewed, committed migrations only)
        run: pnpm migrate

      - name: Start services and gateway
        run: |
          mkdir -p logs
          for dir in services/* apps/gateway; do
            (cd "$dir" && nohup node dist/main.js > "../../logs/$(basename "$dir").log" 2>&1 &)
          done
          for i in $(seq 1 90); do curl -sf localhost:4100/health/ready && exit 0; sleep 1; done
          echo "services did not become ready"; curl -s localhost:4100/health/ready; tail -n 30 logs/*.log; exit 1
      - name: End-to-end smoke test (through the gateway)
        run: pnpm smoke

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: logs/

  images:
    name: Docker image (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        target:
          - apps/gateway
          - services/identity
          - services/organization
          - services/notification
          - services/catalog
          - services/discovery
          - services/procurement
          - services/commerce
          - services/inventory
          - services/warehouse
          - services/logistics
          - services/quality
          - services/agriculture
          - services/manufacturing
          - services/kyc
          - services/kyb
          - services/finance
          - services/document
          - services/dispute
          - services/integration
          - services/analytics
          - services/administration
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          build-args: TARGET=${{ matrix.target }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
