# Generated by scripts/generate-vps.mjs — edit that script, then `pnpm vps:generate`.
# Single-server deployment of the UBOCE backend. See docs/DEPLOY-VPS.md.
name: uboce

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-app: &app
  restart: unless-stopped
  networks: [internal]
  logging: *logging
  environment:
    # 22 Node processes share the server; keep each heap modest.
    NODE_OPTIONS: --max-old-space-size=256

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: site.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
    logging: *logging
    depends_on:
      gateway:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Event streams must survive restarts and must never be evicted.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    networks: [internal]
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  storage:
    image: ${IMAGE_PREFIX:-ghcr.io/bekidink/uboce}-storage:${TAG:-latest}
    build:
      context: ../../infrastructure/docker/seaweedfs
    restart: unless-stopped
    env_file: env/storage.env
    volumes:
      - storage_data:/data
    networks: [internal]
    logging: *logging

  # Applies every service's pending migrations, then exits; services start after it.
  migrate:
    image: ${IMAGE_PREFIX:-ghcr.io/bekidink/uboce}-migrate:${TAG:-latest}
    build:
      context: ../..
      target: migrate
    restart: "no"
    env_file: env/migrate.env
    networks: [internal]
    logging: *logging

  identity:
    <<: *app
    image: ${IMAGE_PREFIX:-ghcr.io/bekidink/uboce}-identity:${TAG:-latest}
    build:
      context: ../..
      target: runtime
      args:
        TARGET: services/identity
    env_file: env/identity.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4101/health/live"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  organization:
    <<: *app
    image: ${IMAGE_PREFIX:-ghcr.io/bekidink/uboce}-organization:${TAG:-latest}
