# GENERATED by scripts/generate-compose.mjs from infrastructure/services.json — edit those, not this.
name: uboce

# `docker compose up -d` starts infrastructure only (for `pnpm dev`).
# `docker compose --profile apps up -d --build` also runs every service in containers.

x-service: &service
  profiles: [apps]
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  environment: &service-env
    NODE_ENV: production
    REDIS_URL: redis://redis:6379
    IDENTITY_URL: http://identity:4101
    ORGANIZATION_URL: http://organization:4102
    NOTIFICATION_URL: http://notification:4103
    CATALOG_URL: http://catalog:4104
    DISCOVERY_URL: http://discovery:4105
    PROCUREMENT_URL: http://procurement:4106
    COMMERCE_URL: http://commerce:4107
    INVENTORY_URL: http://inventory:4108
    WAREHOUSE_URL: http://warehouse:4109
    LOGISTICS_URL: http://logistics:4110
    QUALITY_URL: http://quality:4111
    AGRICULTURE_URL: http://agriculture:4112
    MANUFACTURING_URL: http://manufacturing:4113
    KYC_URL: http://kyc:4114
    KYB_URL: http://kyb:4115
    FINANCE_URL: http://finance:4116
    DOCUMENT_URL: http://document:4117
    DISPUTE_URL: http://dispute:4118
    INTEGRATION_URL: http://integration:4119
    ANALYTICS_URL: http://analytics:4120
    ADMINISTRATION_URL: http://administration:4121

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every outgoing email locally. Inbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - '1025:1025'
      - '8025:8025'

  # Private S3-compatible storage for the Document service.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: ['server', '-dir=/data', '-s3', '-s3.port=8333', '-s3.config=/etc/seaweedfs/s3.json', '-master.volumeSizeLimitMB=256']
    ports:
      - '8333:8333'
    volumes:
      - s3data:/data
      - ./infrastructure/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # ---- Application services (profile: apps) -------------------------------------
  # Migrations run as a one-shot container before the services start.

  migrate:
    <<: *service
    restart: 'no'
    build: { context: ., target: migrate }
    environment:
      IDENTITY_DATABASE_URL: postgresql://identity_svc:identity_dev@postgres:5432/identity
      ORGANIZATION_DATABASE_URL: postgresql://organization_svc:organization_dev@postgres:5432/organization
      NOTIFICATION_DATABASE_URL: postgresql://notification_svc:notification_dev@postgres:5432/notification
      CATALOG_DATABASE_URL: postgresql://catalog_svc:catalog_dev@postgres:5432/catalog
      DISCOVERY_DATABASE_URL: postgresql://discovery_svc:discovery_dev@postgres:5432/discovery
      PROCUREMENT_DATABASE_URL: postgresql://procurement_svc:procurement_dev@postgres:5432/procurement
      COMMERCE_DATABASE_URL: postgresql://commerce_svc:commerce_dev@postgres:5432/commerce
      INVENTORY_DATABASE_URL: postgresql://inventory_svc:inventory_dev@postgres:5432/inventory
      WAREHOUSE_DATABASE_URL: postgresql://warehouse_svc:warehouse_dev@postgres:5432/warehouse
      LOGISTICS_DATABASE_URL: postgresql://logistics_svc:logistics_dev@postgres:5432/logistics
      QUALITY_DATABASE_URL: postgresql://quality_svc:quality_dev@postgres:5432/quality
      AGRICULTURE_DATABASE_URL: postgresql://agriculture_svc:agriculture_dev@postgres:5432/agriculture
      MANUFACTURING_DATABASE_URL: postgresql://manufacturing_svc:manufacturing_dev@postgres:5432/manufacturing
      KYC_DATABASE_URL: postgresql://kyc_svc:kyc_dev@postgres:5432/kyc
      KYB_DATABASE_URL: postgresql://kyb_svc:kyb_dev@postgres:5432/kyb
      FINANCE_DATABASE_URL: postgresql://finance_svc:finance_dev@postgres:5432/finance
      DOCUMENT_DATABASE_URL: postgresql://document_svc:document_dev@postgres:5432/document
      DISPUTE_DATABASE_URL: postgresql://dispute_svc:dispute_dev@postgres:5432/dispute
      INTEGRATION_DATABASE_URL: postgresql://integration_svc:integration_dev@postgres:5432/integration
      ANALYTICS_DATABASE_URL: postgresql://analytics_svc:analytics_dev@postgres:5432/analytics
      ADMINISTRATION_DATABASE_URL: postgresql://administration_svc:administration_dev@postgres:5432/administration

  identity:
    <<: *service
    build: { context: ., target: runtime, args: { TARGET: services/identity } }
    env_file: services/identity/.env
    environment:
