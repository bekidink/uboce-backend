# Generated by scripts/generate-render.mjs — edit that script, then `pnpm render:generate`.
# Render Blueprint for the UBOCE backend. See docs/DEPLOY.md.
services:
  - type: web
    name: uboce-gateway
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: TARGET
        value: apps/gateway
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4100"
      - key: LOG_LEVEL
        value: info
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: uboce-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: https://app.example.com
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: IDENTITY_URL
        fromService:
          type: pserv
          name: uboce-identity
          property: hostport
      - key: ORGANIZATION_URL
        fromService:
          type: pserv
          name: uboce-organization
          property: hostport
      - key: NOTIFICATION_URL
        fromService:
          type: pserv
          name: uboce-notification
          property: hostport
      - key: CATALOG_URL
        fromService:
          type: pserv
          name: uboce-catalog
          property: hostport
      - key: DISCOVERY_URL
        fromService:
          type: pserv
          name: uboce-discovery
          property: hostport
      - key: PROCUREMENT_URL
        fromService:
          type: pserv
          name: uboce-procurement
          property: hostport
      - key: COMMERCE_URL
        fromService:
          type: pserv
          name: uboce-commerce
          property: hostport
      - key: DOCS_ENABLED
        value: "false"

  - type: pserv
    name: uboce-identity
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: npx --no-install prisma migrate deploy
    autoDeploy: true
    envVars:
      - key: TARGET
        value: services/identity
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4101"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: uboce-redis
          property: connectionString
      - key: JWT_ISSUER
        value: uboce-identity
      - key: JWT_AUDIENCE
        value: uboce
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: SERVICE_CLIENT_ID
        value: identity
      - key: SERVICE_CLIENT_SECRET
        sync: false
      - key: ORGANIZATION_URL
        fromService:
          type: pserv
          name: uboce-organization
          property: hostport
      - key: NOTIFICATION_URL
        fromService:
          type: pserv
          name: uboce-notification
          property: hostport
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: SERVICE_TOKEN_TTL_SECONDS
        value: "300"
      - key: APP_BASE_URL
        value: https://app.example.com
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: SERVICE_CLIENTS
        sync: false
      - key: MIGRATE_DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: INTERNAL_CALL_TIMEOUT_MS
        value: "10000"

